<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Professional portfolio showcasing experience, skills, and LinkedIn profile."
    />
    <title>LinkedIn Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Main navigation">
        <a class="nav__brand" href="#hero">Portfolio</a>
        <ul class="nav__links">
          <li><a href="#hero">About</a></li>
          <li><a href="#experience">Experience</a></li>
          <li><a href="#skills">Skills</a></li>
        </ul>
        <button
          class="nav__toggle"
          type="button"
          aria-label="Toggle menu"
          aria-expanded="false"
        ></button>
      </nav>
    </header>

    <main id="main-content">
      <div id="hero-container"></div>
      <div id="experience-container"></div>
      <div id="skills-container"></div>
    </main>

    <footer class="site-footer">
      <p>&copy; <span id="year"></span> <span id="footer-name"></span>. All rights reserved.</p>
    </footer>

    <script src="script.js" type="module"></script>
  </body>
</html>
