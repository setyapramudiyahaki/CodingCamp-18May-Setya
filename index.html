<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="dashboard">
      <button
        type="button"
        id="theme-toggle"
        class="theme-toggle"
        aria-label="Toggle light or dark mode"
        title="Toggle theme"
      >
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
      </button>

      <!-- Greeting Card -->
      <section class="card card--greeting" aria-labelledby="greeting-title">
        <input
          type="text"
          id="user-name"
          class="greeting__name-input"
          placeholder="Your name (optional)"
          aria-label="Your name"
          maxlength="40"
        />
        <p id="live-clock" class="greeting__clock" aria-live="polite">00:00:00</p>
        <p id="live-date" class="greeting__date">Loading date…</p>
        <h1 id="greeting-text" class="greeting__message">Good Morning</h1>
      </section>

      <div class="dashboard__grid">
        <!-- Focus Timer -->
        <section class="card card--timer" aria-labelledby="timer-title">
          <h2 id="timer-title" class="card__title">Focus Timer</h2>
          <p id="timer-display" class="timer__display" aria-live="polite">25:00</p>
          <div class="timer__duration">
            <label for="timer-minutes">Minutes</label>
            <input
              type="number"
              id="timer-minutes"
              min="1"
              max="120"
              value="25"
            />
          </div>
          <div class="timer__controls">
            <button type="button" id="timer-start" class="btn btn--primary">
              Start
            </button>
            <button type="button" id="timer-stop" class="btn btn--secondary">
              Stop
            </button>
            <button type="button" id="timer-reset" class="btn btn--ghost">
              Reset
            </button>
          </div>
        </section>

        <!-- Tasks -->
        <section class="card card--tasks" aria-labelledby="tasks-title">
          <h2 id="tasks-title" class="card__title">Tasks</h2>
          <form id="task-form" class="tasks__form">
            <input
              type="text"
              id="task-input"
              class="tasks__input"
              placeholder="Add a new task..."
              autocomplete="off"
              maxlength="200"
            />
            <button type="submit" class="btn btn--primary">Add</button>
          </form>
          <ul id="task-list" class="tasks__list" role="list"></ul>
        </section>

        <!-- Quick Links -->
        <section class="card card--links" aria-labelledby="links-title">
          <h2 id="links-title" class="card__title">Quick Links</h2>
          <form id="link-form" class="links__form">
            <input
              type="text"
              id="link-name"
              class="links__input"
              placeholder="Link name"
              maxlength="40"
            />
            <input
              type="url"
              id="link-url"
              class="links__input"
              placeholder="URL"
            />
            <button type="submit" class="btn btn--primary">Add Link</button>
          </form>
          <div id="link-pills" class="links__pills" role="list"></div>
        </section>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
